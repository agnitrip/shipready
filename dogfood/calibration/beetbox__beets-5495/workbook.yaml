    \ google *\r\n  google_key: []\r\nembedart:\r\n  ifempty: true\r\n  maxwidth: 400\r\nplaylist:\r\n\
    \  auto: yes\r\n  relative_to: ~/Music/Playlists\r\n  playlist_dir: ~/Music/Playlists/Vinyl Rips/Tech/\r\
