    \n  playlists:\r\n    -  name: 'Recently 3 months.m3u'\r\n       query: 'added:-3m..'\r\nwlg:\r\n\
    \  auto: yes\r\n  force: no\r\n  count: 3\r\n  separator: ', '\r\n  whitelist: wlg\r\nbpm:\r\n  max_strokes:\
    \ 5\r\n```"
  expected_behavior: The agent derives the required behavior from the issue, locates the relevant source,
    implements the change in source files only, verifies it against the issue's real contract, and submits
    a patch that would satisfy the issue's acceptance tests.
  notes: Real SWE-bench-Live instance beetbox__beets-5495. Trace and patch supplied via CLI from this
    instance directory.
