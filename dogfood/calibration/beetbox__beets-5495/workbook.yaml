    , line 446, in run_parallel\r\n    raise exc_info[1].with_traceback(exc_info[2])\r\n  File \"/usr/local/lib/python3.9/dist-packages/beets-1.6.1-py3.9.egg/beets/util/pipeline.py\"\
    , line 311, in run\r\n    out = self.coro.send(msg)\r\n  File \"/usr/local/lib/python3.9/dist-packages/beets-1.6.1-py3.9.egg/beets/util/pipeline.py\"\
    , line 193, in coro\r\n    func(*(args + (task,)))\r\n  File \"/usr/local/lib/python3.9/dist-packages/beets-1.6.1-py3.9.egg/beets/importer.py\"\
